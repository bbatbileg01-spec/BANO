<!DOCTYPE html>
<html lang="mn">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>BANO Premium — Кино</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#070707;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

.header{
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 5%;
  background:rgba(8,8,8,.95);
  border-bottom:1px solid #242424;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  font-size:27px;
  font-weight:900;
  letter-spacing:2px;
}

.logo span{
  color:#e50914;
}

.back{
  color:#aaa;
  text-decoration:none;
  font-size:14px;
}

.back:hover{
  color:#fff;
}

.container{
  width:90%;
  max-width:1100px;
  margin:auto;
  padding:35px 0 60px;
}

.loading{
  text-align:center;
  color:#888;
  padding:100px 0;
}

.movie-layout{
  display:grid;
  grid-template-columns:280px 1fr;
  gap:35px;
}

.poster{
  width:100%;
  aspect-ratio:2/3;
  border-radius:12px;
  overflow:hidden;
  background:#151515;
  border:1px solid #292929;
}

.poster img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.no-poster{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:60px;
}

.badge{
  display:inline-block;
  background:#e50914;
  color:#fff;
  font-size:11px;
  font-weight:bold;
  padding:6px 10px;
  border-radius:5px;
  margin-bottom:14px;
}

.badge.premium{
  background:#d4a62a;
  color:#111;
}

h1{
  font-size:40px;
  margin-bottom:15px;
}

.meta{
  color:#888;
  font-size:14px;
  margin-bottom:20px;
}

.description{
  color:#bbb;
  line-height:1.7;
  max-width:700px;
  margin-bottom:20px;
}


/* =========================
   ACTION BUTTONS
========================= */

.action-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:5px;
}

.action-btn{
  border:1px solid #333;
  background:#151515;
  color:#fff;
  border-radius:8px;
  padding:12px 18px;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
  transition:.2s;
}

.action-btn:hover{
  background:#e50914;
  border-color:#e50914;
}

.action-btn.active{
  background:#e50914;
  border-color:#e50914;
}

.action-btn.list-active{
  background:#333;
  border-color:#555;
}

.action-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}


/* =========================
   VIDEO
========================= */

.video-box{
  margin-top:30px;
  background:#000;
  border-radius:12px;
  overflow:hidden;
  border:1px solid #242424;
}

video{
  width:100%;
  display:block;
  max-height:650px;
  background:#000;
}


/* =========================
   NOTICE
========================= */

.notice{
  margin-top:30px;
  padding:30px;
  text-align:center;
  background:#121212;
  border:1px solid #292929;
  border-radius:12px;
}

.notice-icon{
  font-size:45px;
  margin-bottom:12px;
}

.notice h2{
  margin-bottom:10px;
}

.notice p{
  color:#888;
  line-height:1.6;
  margin-bottom:20px;
}

.btn{
  display:inline-block;
  border:0;
  border-radius:8px;
  padding:12px 20px;
  background:#e50914;
  color:#fff;
  font-weight:bold;
  text-decoration:none;
  cursor:pointer;
}

.btn.gold{
  background:#d4a62a;
  color:#111;
}

.error{
  text-align:center;
  padding:100px 20px;
}

.error h2{
  margin-bottom:15px;
}

.error p{
  color:#888;
}


/* =========================
   MOBILE
========================= */

@media(max-width:750px){

  .header{
    height:62px;
    padding:0 18px;
  }

  .logo{
    font-size:22px;
  }

  .container{
    width:94%;
    padding-top:25px;
  }

  .movie-layout{
    grid-template-columns:1fr;
    gap:25px;
  }

  .poster{
    width:190px;
    margin:auto;
  }

  h1{
    font-size:29px;
  }

  .description{
    font-size:14px;
  }

  .action-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
  }

  .action-btn{
    width:100%;
    padding:13px 8px;
  }

}

</style>

</head>


<body>


<header class="header">

  <div class="logo">
    BANO<span>+</span>
  </div>

  <a
    class="back"
    href="index.html"
  >
    ← Буцах
  </a>

</header>


<main class="container">


  <div
    id="loading"
    class="loading"
  >
    Кино ачаалж байна...
  </div>


  <div
    id="content"
    style="display:none;"
  >

    <div class="movie-layout">


      <!-- POSTER -->

      <div>

        <div class="poster">

          <img
            id="poster"
            style="display:none;"
            alt=""
          >

          <div
            id="noPoster"
            class="no-poster"
          >
            🎬
          </div>

        </div>

      </div>


      <!-- MOVIE INFO -->

      <div>


        <div
          id="badge"
          class="badge"
        >
          КИНО
        </div>


        <h1 id="title">
          Кино
        </h1>


        <div
          id="meta"
          class="meta"
        ></div>


        <p
          id="description"
          class="description"
        ></p>


        <!-- ACTION BUTTONS -->

        <div class="action-buttons">


          <button
            id="favoriteBtn"
            class="action-btn"
            onclick="toggleFavorite()"
          >
            ♡ Дуртайд нэмэх
          </button>


          <button
            id="myListBtn"
            class="action-btn"
            onclick="toggleMyList()"
          >
            📋 Жагсаалтад нэмэх
          </button>


        </div>


        <!-- VIDEO -->

        <div
          id="videoArea"
        ></div>


      </div>

    </div>

  </div>


  <!-- ERROR -->

  <div
    id="error"
    class="error"
    style="display:none;"
  >

    <h2>
      😔 Кино олдсонгүй
    </h2>

    <p>
      Энэ кино устсан эсвэл буруу холбоос байна.
    </p>

  </div>


</main>



<script>


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  "https://idjqvulwffvtqplwmamt.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_XsH8zpr25shhUUDjMEo0cQ_e5df7co5";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );



/* =========================================
   MOVIE ID
========================================= */

const params =
  new URLSearchParams(
    window.location.search
  );


const movieId =
  params.get("id");



/* =========================================
   VARIABLES
========================================= */

let currentMovie = null;

let currentUser = null;

let favoriteId = null;

let myListId = null;



/* =========================================
   ELEMENTS
========================================= */

const loading =
  document.getElementById("loading");


const content =
  document.getElementById("content");


const errorBox =
  document.getElementById("error");


const poster =
  document.getElementById("poster");


const noPoster =
  document.getElementById("noPoster");


const title =
  document.getElementById("title");


const meta =
  document.getElementById("meta");


const description =
  document.getElementById("description");


const badge =
  document.getElementById("badge");


const videoArea =
  document.getElementById("videoArea");


const favoriteBtn =
  document.getElementById("favoriteBtn");


const myListBtn =
  document.getElementById("myListBtn");



/* =========================================
   LOAD MOVIE
========================================= */

async function loadMovie(){


  if(!movieId){

    showError();

    return;

  }


  const {
    data:movie,
    error
  } =
  await supabaseClient

    .from("movies")

    .select("*")

    .eq(
      "id",
      movieId
    )

    .single();


  if(
    error ||
    !movie
  ){

    console.error(error);

    showError();

    return;

  }


  currentMovie =
    movie;


  const {
    data:{
      user
    }
  } =
  await supabaseClient
    .auth
    .getUser();


  currentUser =
    user || null;


  renderMovie(movie);


  await loadFavorite();


  await loadMyList();

}



/* =========================================
   RENDER MOVIE
========================================= */

async function renderMovie(movie){


  loading.style.display =
    "none";


  content.style.display =
    "block";


  document.title =
    "BANO Premium — " +
    (
      movie.title ||
      "Кино"
    );


  title.textContent =
    movie.title ||
    "Нэргүй кино";


  description.textContent =
    movie.description ||
    "Энэ киноны тайлбар одоогоор байхгүй байна.";


  meta.textContent =
    [
      movie.year || "",
      movie.category || ""
    ]

    .filter(Boolean)

    .join(" • ");



  /* POSTER */

  if(movie.poster_url){

    poster.src =
      movie.poster_url;

    poster.style.display =
      "block";

    noPoster.style.display =
      "none";

  }



  /* PREMIUM */

  if(movie.is_premium){

    badge.textContent =
      "💎 PREMIUM";

    badge.classList.add(
      "premium"
    );

    await handlePremiumMovie(movie);

  }

  else{

    badge.textContent =
      "🎬 FREE";

    await showVideo(movie);

  }

}



/* =========================================
   LOAD FAVORITE
========================================= */

async function loadFavorite(){


  if(!currentUser){

    favoriteBtn.textContent =
      "♡ Дуртайд нэмэх";

    favoriteBtn.classList.remove(
      "active"
    );

    return;

  }


  const {
    data,
    error
  } =
  await supabaseClient

    .from("favorites")

    .select("id")

    .eq(
      "user_id",
      currentUser.id
    )

    .eq(
      "movie_id",
      currentMovie.id
    )

    .maybeSingle();


  if(error){

    console.error(
      "Favorite load error:",
      error
    );

    return;

  }


  if(data){

    favoriteId =
      data.id;

    favoriteBtn.textContent =
      "❤️ Дуртайгаас хасах";

    favoriteBtn.classList.add(
      "active"
    );

  }

  else{

    favoriteId =
      null;

    favoriteBtn.textContent =
      "♡ Дуртайд нэмэх";

    favoriteBtn.classList.remove(
      "active"
    );

  }

}



/* =========================================
   TOGGLE FAVORITE
========================================= */

async function toggleFavorite(){


  if(!currentUser){

    alert(
      "❤️ Дуртай кино нэмэхийн тулд эхлээд нэвтэрнэ үү."
    );

    window.location.href =
      "login.html";

    return;

  }


  favoriteBtn.disabled =
    true;



  /* REMOVE */

  if(favoriteId){

    const {
      error
    } =
    await supabaseClient

      .from("favorites")

      .delete()

      .eq(
        "id",
        favoriteId
      )

      .eq(
        "user_id",
        currentUser.id
      );


    if(error){

      console.error(error);

      alert(
        "Дуртайгаас хасахад алдаа гарлаа."
      );

    }

    else{

      favoriteId =
        null;

      favoriteBtn.textContent =
        "♡ Дуртайд нэмэх";

      favoriteBtn.classList.remove(
        "active"
      );

    }

  }



  /* ADD */

  else{

    const {
      data,
      error
    } =
    await supabaseClient

      .from("favorites")

      .insert({

        user_id:
          currentUser.id,

        movie_id:
          currentMovie.id

      })

      .select("id")

      .single();


    if(error){

      console.error(error);

      alert(
        "Дуртайд нэмэхэд алдаа гарлаа."
      );

      await loadFavorite();

    }

    else{

      favoriteId =
        data.id;

      favoriteBtn.textContent =
        "❤️ Дуртайгаас хасах";

      favoriteBtn.classList.add(
        "active"
      );

    }

  }


  favoriteBtn.disabled =
    false;

}



/* =========================================
   LOAD MY LIST
========================================= */

async function loadMyList(){


  if(!currentUser){

    myListBtn.textContent =
      "📋 Жагсаалтад нэмэх";

    myListBtn.classList.remove(
      "list-active"
    );

    return;

  }


  const {
    data,
    error
  } =
  await supabaseClient

    .from("my_list")

    .select("id")

    .eq(
      "user_id",
      currentUser.id
    )

    .eq(
      "movie_link",
      "movie.html?id=" +
      currentMovie.id
    )

    .maybeSingle();


  if(error){

    console.error(
      "My list load error:",
      error
    );

    return;

  }


  if(data){

    myListId =
      data.id;

    myListBtn.textContent =
      "📋 Жагсаалтаас хасах";

    myListBtn.classList.add(
      "list-active"
    );

  }

  else{

    myListId =
      null;

    myListBtn.textContent =
      "📋 Жагсаалтад нэмэх";

    myListBtn.classList.remove(
      "list-active"
    );

  }

}



/* =========================================
   TOGGLE MY LIST
========================================= */

async function toggleMyList(){


  if(!currentUser){

    alert(
      "📋 Жагсаалтад нэмэхийн тулд эхлээд нэвтэрнэ үү."
    );

    window.location.href =
      "login.html";

    return;

  }


  myListBtn.disabled =
    true;



  /* REMOVE */

  if(myListId){

    const {
      error
    } =
    await supabaseClient

      .from("my_list")

      .delete()

      .eq(
        "id",
        myListId
      )

      .eq(
        "user_id",
        currentUser.id
      );


    if(error){

      console.error(error);

      alert(
        "Жагсаалтаас хасахад алдаа гарлаа."
      );

    }

    else{

      myListId =
        null;

      myListBtn.textContent =
        "📋 Жагсаалтад нэмэх";

      myListBtn.classList.remove(
        "list-active"
      );

    }

  }



  /* ADD */

  else{

    const {
      data,
      error
    } =
    await supabaseClient

      .from("my_list")

      .insert({

        user_id:
          currentUser.id,

        movie_name:
          currentMovie.title,

        movie_link:
          "movie.html?id=" +
          currentMovie.id

      })

      .select("id")

      .single();


    if(error){

      console.error(error);

      alert(
        "Жагсаалтад нэмэхэд алдаа гарлаа."
      );

      await loadMyList();

    }

    else{

      myListId =
        data.id;

      myListBtn.textContent =
        "📋 Жагсаалтаас хасах";

      myListBtn.classList.add(
        "list-active"
      );

    }

  }


  myListBtn.disabled =
    false;

}



/* =========================================
   PREMIUM MOVIE
========================================= */

async function handlePremiumMovie(movie){


  const {
    data:{
      user
    }
  } =
  await supabaseClient
    .auth
    .getUser();


  if(!user){

    showPremiumLocked(

      "Premium кино үзэхийн тулд нэвтэрнэ үү.",

      "Нэвтрэх",

      "login.html"

    );

    return;

  }


  const {
    data:premium,
    error
  } =
  await supabaseClient

    .from("user_premium")

    .select(
      "premium_until"
    )

    .eq(
      "user_id",
      user.id
    )

    .maybeSingle();


  if(

    error ||

    !premium ||

    !premium.premium_until ||

    new Date(
      premium.premium_until
    ) <= new Date()

  ){

    showPremiumLocked(

      "Энэ кино зөвхөн Premium эрхтэй хэрэглэгчдэд зориулагдсан.",

      "💎 Premium авах",

      "premium.html"

    );

    return;

  }


  await showVideo(movie);

}



/* =========================================
   PREMIUM LOCK
========================================= */

function showPremiumLocked(
  text,
  buttonText,
  link
){

  videoArea.innerHTML = `

    <div class="notice">

      <div class="notice-icon">
        🔒
      </div>

      <h2>
        Premium кино
      </h2>

      <p>
        ${text}
      </p>

      <a
        class="btn gold"
        href="${link}"
      >
        ${buttonText}
      </a>

    </div>

  `;

}



/* =========================================
   SHOW VIDEO
========================================= */

async function showVideo(movie){


  if(!movie.video_url){

    videoArea.innerHTML = `

      <div class="notice">

        <div class="notice-icon">
          🎬
        </div>

        <h2>
          Видео одоогоор байхгүй
        </h2>

        <p>
          Энэ кинонд видео файл нэмэгдээгүй байна.
        </p>

      </div>

    `;

    return;

  }


  let videoUrl =
    movie.video_url;


  try{

    const parsed =
      parseSupabaseStorageUrl(
        movie.video_url
      );


    if(parsed){

      const {
        data,
        error
      } =
      await supabaseClient

        .storage

        .from(
          parsed.bucket
        )

        .createSignedUrl(
          parsed.path,
          3600
        );


      if(

        !error &&

        data &&

        data.signedUrl

      ){

        videoUrl =
          data.signedUrl;

      }

    }

  }

  catch(err){

    console.error(
      "Signed URL error:",
      err
    );

  }


  videoArea.innerHTML = `

    <div class="video-box">

      <video
        id="movieVideo"
        controls
        playsinline
        preload="metadata"
      >

        <source
          src="${escapeHtml(videoUrl)}"
        >

        Таны төхөөрөмж видео тоглуулахыг дэмжихгүй байна.

      </video>

    </div>

  `;

}



/* =========================================
   PARSE STORAGE URL
========================================= */

function parseSupabaseStorageUrl(url){

  try{

    if(

      !url ||

      !url.includes(
        "/storage/v1/object/"
      )

    ){

      return null;

    }


    const part =
      url.split(
        "/storage/v1/object/"
      )[1];


    if(!part){

      return null;

    }


    let clean =
      part.replace(
        /^public\//,
        ""
      );


    clean =
      clean.replace(
        /^sign\//,
        ""
      );


    clean =
      clean.replace(
        /^authenticated\//,
        ""
      );


    const slash =
      clean.indexOf("/");


    if(slash === -1){

      return null;

    }


    const bucket =
      clean.substring(
        0,
        slash
      );


    const path =
      clean.substring(
        slash + 1
      );


    if(
      !bucket ||
      !path
    ){

      return null;

    }


    return {
      bucket:bucket,
      path:path
    };

  }

  catch(error){

    console.error(error);

    return null;

  }

}



/* =========================================
   ERROR
========================================= */

function showError(){

  loading.style.display =
    "none";

  content.style.display =
    "none";

  errorBox.style.display =
    "block";

}



/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value){

  if(

    value === null ||

    value === undefined

  ){

    return "";

  }


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}



/* =========================================
   START
========================================= */

loadMovie();

</script>

</html>
