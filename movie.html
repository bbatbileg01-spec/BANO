<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BANO — Кино</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#07080b;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

header{
  height:72px;
  padding:0 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#08090c;
  border-bottom:1px solid #202228;
}

.logo{
  font-size:30px;
  font-weight:900;
  letter-spacing:5px;
}

.logo span{
  color:#ff9d00;
}

.back{
  color:#aaa;
  text-decoration:none;
}

.back:hover{
  color:#fff;
}


/* VIDEO */

.player-section{
  padding:40px 6% 20px;
}

.player{
  max-width:1100px;
  margin:auto;
  background:#000;
  border-radius:14px;
  overflow:hidden;
  border:1px solid #252830;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}

video{
  width:100%;
  display:block;
  background:#000;
  aspect-ratio:16/9;
}


/* MOVIE INFO */

.movie-section{
  padding:40px 6% 70px;
}

.movie-content{
  max-width:1100px;
  margin:auto;
}

.badge{
  display:inline-block;
  padding:8px 14px;
  border:1px solid #ff9d00;
  border-radius:30px;
  color:#ffb52e;
  font-size:12px;
  font-weight:bold;
  margin-bottom:18px;
}

h1{
  font-size:48px;
  margin-bottom:15px;
}

.description{
  color:#aaa;
  font-size:17px;
  line-height:1.7;
  max-width:750px;
  margin-bottom:20px;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:18px;
  color:#aaa;
  margin-bottom:25px;
}

.rating{
  color:#ffb52e;
  font-weight:bold;
}

.buttons{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:13px 22px;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;
  border:none;
  cursor:pointer;
}

.primary{
  background:#ff9d00;
  color:#08090c;
}

.secondary{
  background:#1b1d23;
  color:#fff;
  border:1px solid #30333a;
}


/* NOTICE */

.notice{
  max-width:1100px;
  margin:0 auto 40px;
  padding:15px 18px;
  background:#111318;
  border:1px solid #252830;
  border-radius:10px;
  color:#888;
  font-size:13px;
}


/* LOADING */

.loading{
  text-align:center;
  padding:60px 20px;
  color:#aaa;
  font-size:18px;
}

.error{
  text-align:center;
  padding:60px 20px;
  color:#ff6b6b;
  font-size:17px;
}


/* FOOTER */

footer{
  padding:40px 6%;
  text-align:center;
  color:#666;
  border-top:1px solid #1c1e23;
}


/* MOBILE */

@media(max-width:700px){

  header{
    height:64px;
    padding:0 5%;
  }

  .logo{
    font-size:25px;
  }

  .player-section{
    padding:25px 5% 15px;
  }

  .player{
    border-radius:10px;
  }

  .movie-section{
    padding:30px 5% 55px;
  }

  h1{
    font-size:36px;
  }

  .description{
    font-size:15px;
  }

}

</style>

</head>

<body>


<header>

  <div class="logo">
    BAN<span>O</span>
  </div>

  <a class="back" href="index.html">
    ← Нүүр
  </a>

</header>


<!-- VIDEO PLAYER -->

<section class="player-section">

  <div class="player">

    <video
      id="movieVideo"
      controls
      playsinline
      preload="metadata"
    >
      Таны төхөөрөмж видео тоглуулагчийг дэмжихгүй байна.
    </video>

  </div>

</section>


<div
  class="notice"
  id="notice"
>
  🎬 Кино ачаалж байна...
</div>


<!-- MOVIE INFORMATION -->

<section class="movie-section">

  <div
    class="movie-content"
    id="movieContent"
  >

    <div class="loading">
      ⏳ Киноны мэдээлэл ачаалж байна...
    </div>

  </div>

</section>


<footer>

  <div class="logo">
    BAN<span>O</span>
  </div>

  <br>

  © 2026 BANO • Бүх эрх хуулиар хамгаалагдсан.

</footer>


<script>

/* ==================================================
   SUPABASE
================================================== */

const SUPABASE_URL =
"https://idjqvulwffvtqplwmamt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_XsH8zpr25shhUUDjMEo0cQ_e5df7co5";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* ==================================================
   GET MOVIE ID FROM URL
================================================== */

const params =
new URLSearchParams(
  window.location.search
);

const movieId =
params.get("id");


/* ==================================================
   ELEMENTS
================================================== */

const movieVideo =
document.getElementById(
  "movieVideo"
);

const movieContent =
document.getElementById(
  "movieContent"
);

const notice =
document.getElementById(
  "notice"
);


/* ==================================================
   LOAD MOVIE
================================================== */

async function loadMovie(){

  if(!movieId){

    movieContent.innerHTML = `
      <div class="error">
        ❌ Киноны ID олдсонгүй.
      </div>
    `;

    notice.textContent =
      "❌ Кино сонгогдоогүй байна.";

    return;
  }


  const {
    data: movie,
    error
  } = await supabaseClient
    .from("movies")
    .select("*")
    .eq("id", movieId)
    .single();


  if(error){

    console.error(
      "Movie load error:",
      error
    );

    movieContent.innerHTML = `
      <div class="error">
        ❌ Киноны мэдээллийг ачаалж чадсангүй.
      </div>
    `;

    notice.textContent =
      "❌ Кино ачаалахад алдаа гарлаа.";

    return;
  }


  if(!movie){

    movieContent.innerHTML = `
      <div class="error">
        ❌ Кино олдсонгүй.
      </div>
    `;

    return;
  }


  /* ==================================================
     PAGE TITLE
  ================================================== */

  document.title =
    "BANO — " + movie.title;


  /* ==================================================
     MOVIE INFORMATION
  ================================================== */

  movieContent.innerHTML = `

    <div class="badge">

      ${
        movie.is_premium
        ? "💎 PREMIUM"
        : "🎬 BANO MOVIE"
      }

    </div>


    <h1>
      ${movie.title}
    </h1>


    <p class="description">

      ${
        movie.description
        || "Энэ киноны тайлбар одоогоор оруулаагүй байна."
      }

    </p>


    <div class="meta">

      ${
        movie.year
        ? `<span>${movie.year}</span>`
        : ""
      }

      ${
        movie.category
        ? `<span>${movie.category}</span>`
        : ""
      }

      ${
        movie.is_premium
        ? `<span class="rating">💎 Premium</span>`
        : `<span class="rating">▶ Үзэх боломжтой</span>`
      }

    </div>


    <div class="buttons">

      <button
        class="btn primary"
        onclick="playMovie()"
      >
        ▶ Кино үзэх
      </button>


      <a
        class="btn secondary"
        href="index.html"
      >
        ← Буцах
      </a>

    </div>

  `;


  /* ==================================================
     VIDEO
  ================================================== */

  if(movie.video_url){

    let videoUrl =
      movie.video_url;


    /*
      Хэрэв video_url нь
      Supabase Storage-ийн
      private file path бол
      signed URL үүсгэнэ.
    */

    if(
      videoUrl.includes(
        "/storage/v1/object/"
      )
    ){

      try{

        const parts =
          videoUrl.split(
            "/storage/v1/object/"
          )[1];

        const cleanPath =
          parts
          .replace(
            "public/",
            ""
          )
          .replace(
            "sign/",
            ""
          )
          .replace(
            "authenticated/",
            ""
          );

        const firstSlash =
          cleanPath.indexOf("/");

        const bucket =
          cleanPath.substring(
            0,
            firstSlash
          );

        const filePath =
          cleanPath.substring(
            firstSlash + 1
          );


        const {
          data,
          error
        } =
        await supabaseClient
          .storage
          .from(bucket)
          .createSignedUrl(
            filePath,
            3600
          );


        if(
          !error &&
          data &&
          data.signedUrl
        ){

          videoUrl =
            data.signedUrl;

        }

      }
      catch(e){

        console.error(
          "Signed URL error:",
          e
        );

      }

    }


    movieVideo.src =
      videoUrl;

    movieVideo.load();


    notice.textContent =
      "🎬 " +
      movie.title +
      " — Видео бэлэн.";

  }
  else{

    notice.textContent =
      "🎬 Энэ кинонд видео файл оруулаагүй байна.";

  }

}


/* ==================================================
   PLAY
================================================== */

function playMovie(){

  movieVideo
    .play()
    .catch(function(error){

      console.error(
        "Video play error:",
        error
      );

    });

}


/* ==================================================
   START
================================================== */

loadMovie();

</script>

</body>
</html>
