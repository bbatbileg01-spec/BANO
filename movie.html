<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BANO — Кино</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#07080b;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

header{
  height:72px;
  padding:0 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(7,8,11,.96);
  border-bottom:1px solid rgba(255,255,255,.06);
}

.logo{
  font-size:30px;
  font-weight:900;
  letter-spacing:5px;
}

.logo span{
  color:#ff9d00;
}

.back{
  color:#aaa;
  text-decoration:none;
  font-size:15px;
}

.back:hover{
  color:#fff;
}

.movie-page{
  min-height:calc(100vh - 72px);
  padding:70px 6%;
  background:
    radial-gradient(circle at 80% 35%,rgba(255,157,0,.16),transparent 30%),
    linear-gradient(90deg,#07080b,#0b0c10);
}

.movie-content{
  max-width:1150px;
  margin:auto;
  display:grid;
  grid-template-columns:330px 1fr;
  gap:55px;
  align-items:center;
}

.poster{
  height:470px;
  border-radius:18px;
  background:
    radial-gradient(circle at 70% 20%,#ff9d00,transparent 25%),
    linear-gradient(145deg,#4a2700,#151515 65%);
  display:flex;
  align-items:flex-end;
  padding:25px;
  box-shadow:0 25px 60px rgba(0,0,0,.55);
  position:relative;
  overflow:hidden;
}

.poster:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(0deg,rgba(0,0,0,.8),transparent 60%);
}

.poster-title{
  position:relative;
  z-index:2;
  font-size:42px;
  line-height:.95;
  font-weight:900;
}

.badge{
  display:inline-block;
  padding:8px 14px;
  border:1px solid #ff9d00;
  border-radius:30px;
  color:#ffb52e;
  font-size:12px;
  font-weight:bold;
  letter-spacing:1px;
  margin-bottom:20px;
}

h1{
  font-size:55px;
  margin-bottom:15px;
}

.description{
  color:#aaa;
  font-size:17px;
  line-height:1.7;
  max-width:650px;
  margin-bottom:25px;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:18px;
  color:#aaa;
  margin-bottom:30px;
}

.meta strong{
  color:#fff;
}

.rating{
  color:#ffb52e;
  font-weight:bold;
}

.buttons{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:14px 25px;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;
}

.primary{
  background:#ff9d00;
  color:#08090c;
}

.secondary{
  background:#1b1d23;
  color:#fff;
  border:1px solid #30333a;
}

footer{
  padding:40px 6%;
  text-align:center;
  color:#666;
  border-top:1px solid #1c1e23;
}

@media(max-width:750px){

  header{
    height:64px;
  }

  .movie-page{
    padding:40px 5%;
  }

  .movie-content{
    grid-template-columns:1fr;
    gap:35px;
  }

  .poster{
    width:100%;
    max-width:330px;
    height:450px;
    margin:auto;
  }

  h1{
    font-size:40px;
  }

  .description{
    font-size:15px;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    BAN<span>O</span>
  </div>

  <a class="back" href="index.html">
    ← Нүүр хуудас
  </a>

</header>


<main class="movie-page">

  <div class="movie-content">

    <div class="poster">

      <div class="poster-title">
        BANO<br>ONE
      </div>

    </div>


    <div>

      <div class="badge">
        BANO ORIGINAL
      </div>

      <h1>
        BANO ONE
      </h1>

      <p class="description">
        BANO платформын онцлох кино.
        Тулаан, адал явдал, нууцлаг үйл явдлаар
        дүүрэн шинэ бүтээл.
      </p>

      <div class="meta">

        <span><strong>2026</strong></span>

        <span>Action</span>

        <span>Монгол</span>

        <span class="rating">⭐ 9.2</span>

      </div>


      <div class="buttons">

        <a class="btn primary" href="#">
          ▶ Кино үзэх
        </a>

        <a class="btn secondary" href="index.html">
          ← Буцах
        </a>

      </div>

    </div>

  </div>

</main>


<footer>

  <div class="logo">
    BAN<span>O</span>
  </div>

  <br>

  © 2026 BANO • Бүх эрх хуулиар хамгаалагдсан.

</footer>

</body>
</html>
