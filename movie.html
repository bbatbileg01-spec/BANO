<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BANO — BANO ONE</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#07080b;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

header{
  height:72px;
  padding:0 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#08090c;
  border-bottom:1px solid #202228;
}

.logo{
  font-size:30px;
  font-weight:900;
  letter-spacing:5px;
}

.logo span{
  color:#ff9d00;
}

.back{
  color:#aaa;
  text-decoration:none;
}

.back:hover{
  color:#fff;
}


/* VIDEO */

.player-section{
  padding:40px 6% 20px;
}

.player{
  max-width:1100px;
  margin:auto;
  background:#000;
  border-radius:14px;
  overflow:hidden;
  border:1px solid #252830;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}

video{
  width:100%;
  display:block;
  background:#000;
  aspect-ratio:16/9;
}


/* MOVIE INFO */

.movie-section{
  padding:40px 6% 70px;
}

.movie-content{
  max-width:1100px;
  margin:auto;
}

.badge{
  display:inline-block;
  padding:8px 14px;
  border:1px solid #ff9d00;
  border-radius:30px;
  color:#ffb52e;
  font-size:12px;
  font-weight:bold;
  margin-bottom:18px;
}

h1{
  font-size:48px;
  margin-bottom:15px;
}

.description{
  color:#aaa;
  font-size:17px;
  line-height:1.7;
  max-width:750px;
  margin-bottom:20px;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:18px;
  color:#aaa;
  margin-bottom:25px;
}

.rating{
  color:#ffb52e;
  font-weight:bold;
}

.buttons{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:13px 22px;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;
}

.primary{
  background:#ff9d00;
  color:#08090c;
}

.secondary{
  background:#1b1d23;
  color:#fff;
  border:1px solid #30333a;
}


/* NOTICE */

.notice{
  max-width:1100px;
  margin:0 auto 40px;
  padding:15px 18px;
  background:#111318;
  border:1px solid #252830;
  border-radius:10px;
  color:#888;
  font-size:13px;
}


/* FOOTER */

footer{
  padding:40px 6%;
  text-align:center;
  color:#666;
  border-top:1px solid #1c1e23;
}


/* MOBILE */

@media(max-width:700px){

  header{
    height:64px;
    padding:0 5%;
  }

  .logo{
    font-size:25px;
  }

  .player-section{
    padding:25px 5% 15px;
  }

  .player{
    border-radius:10px;
  }

  .movie-section{
    padding:30px 5% 55px;
  }

  h1{
    font-size:36px;
  }

  .description{
    font-size:15px;
  }

}

</style>

</head>

<body>


<header>

  <div class="logo">
    BAN<span>O</span>
  </div>

  <a class="back" href="index.html">
    ← Нүүр
  </a>

</header>


<!-- VIDEO PLAYER -->

<section class="player-section">

  <div class="player">

    <video
      controls
      playsinline
      preload="metadata"
    >

      <!--
      ЭНД ЛИЦЕНЗТЭЙ / ӨӨРИЙН ВИДЕО URL-ЭЭ
      ДАРАА НЬ ОРУУЛНА.
      -->

      <source src="" type="video/mp4">

      Таны төхөөрөмж видео тоглуулагчийг дэмжихгүй байна.

    </video>

  </div>

</section>


<div class="notice">

  🎬 BANO ONE — Видео тоглуулагч бэлэн.
  Одоогоор видео файл холбогдоогүй байна.

</div>


<!-- MOVIE INFORMATION -->

<section class="movie-section">

  <div class="movie-content">

    <div class="badge">
      BANO ORIGINAL
    </div>

    <h1>
      BANO ONE
    </h1>

    <p class="description">

      BANO платформын онцлох бүтээл.
      Тулаан, адал явдал, нууцлаг үйл явдлаар
      дүүрэн шинэ кино.

    </p>


    <div class="meta">

      <span>2026</span>

      <span>Action</span>

      <span>Монгол</span>

      <span class="rating">
        ⭐ 9.2
      </span>

    </div>


    <div class="buttons">

      <a
        class="btn primary"
        href="#"
        onclick="document.querySelector('video').play(); return false;"
      >
        ▶ Кино үзэх
      </a>

      <a
        class="btn secondary"
        href="index.html"
      >
        ← Буцах
      </a>

    </div>

  </div>

</section>


<footer>

  <div class="logo">
    BAN<span>O</span>
  </div>

  <br>

  © 2026 BANO • Бүх эрх хуулиар хамгаалагдсан.

</footer>


</body>
</html>
