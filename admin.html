<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BANO Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 20px;
      background: #111;
      border-bottom: 1px solid #292929;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      color: #e50914;
      font-size: 24px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: bold;
    }

    .logout {
      background: #333;
      color: white;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 25px 15px 60px;
    }

    .card {
      background: #111;
      border: 1px solid #252525;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 25px;
    }

    h2 {
      margin-top: 0;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      margin-top: 7px;
      margin-bottom: 15px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1b1b1b;
      color: white;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }

    .check {
      display: flex;
      gap: 10px;
      align-items: center;
      margin: 10px 0;
      font-weight: normal;
    }

    .check input {
      width: auto;
      margin: 0;
    }

    .add {
      background: #e50914;
      color: white;
      width: 100%;
      font-size: 16px;
      margin-top: 10px;
    }

    .add:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .movie {
      display: flex;
      gap: 15px;
      padding: 15px 0;
      border-bottom: 1px solid #292929;
      align-items: center;
    }

    .movie:last-child {
      border-bottom: 0;
    }

    .poster {
      width: 75px;
      height: 105px;
      object-fit: cover;
      border-radius: 7px;
      background: #222;
      flex-shrink: 0;
    }

    .movie-info {
      flex: 1;
    }

    .movie-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .movie-meta {
      color: #aaa;
      font-size: 14px;
      line-height: 1.6;
    }

    .premium {
      color: #ffd700;
    }

    .featured {
      color: #00d4ff;
    }

    .delete {
      background: #b00020;
      color: white;
    }

    .status {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: none;
    }

    .success {
      background: #123d20;
      color: #7dff9b;
    }

    .error {
      background: #451414;
      color: #ff8f8f;
    }

    .progress {
      display: none;
      margin-top: 10px;
      color: #aaa;
    }

    .file-name {
      color: #aaa;
      font-size: 13px;
      margin-top: -8px;
      margin-bottom: 12px;
    }

    @media (max-width: 600px) {
      .movie {
        align-items: flex-start;
      }

      .movie-info {
        min-width: 0;
      }

      .delete {
        padding: 9px 12px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🎬 BANO ADMIN</h1>
  <button class="logout" onclick="logout()">Гарах</button>
</header>

<main>

  <div id="status" class="status"></div>

  <div class="card">
    <h2>➕ Шинэ кино нэмэх</h2>

    <label>Киноны нэр</label>
    <input id="title" type="text" placeholder="Жишээ: Avatar">

    <label>Тайлбар</label>
    <textarea id="description" placeholder="Киноны тайлбар..."></textarea>

    <label>Ангилал</label>
    <select id="category">
      <option value="Action">Action</option>
      <option value="Drama">Drama</option>
      <option value="Comedy">Comedy</option>
      <option value="Horror">Horror</option>
      <option value="Romance">Romance</option>
      <option value="Sci-Fi">Sci-Fi</option>
      <option value="Animation">Animation</option>
      <option value="Adventure">Adventure</option>
      <option value="Other">Other</option>
    </select>

    <label>Он</label>
    <input id="year" type="number" placeholder="2026">

    <label>🖼️ Poster зураг</label>
    <input id="posterFile" type="file" accept="image/*" onchange="showFileName('posterFile','posterName')">
    <div id="posterName" class="file-name"></div>

    <label>🎬 Кино видео</label>
    <input id="videoFile" type="file" accept="video/*" onchange="showFileName('videoFile','videoName')">
    <div id="videoName" class="file-name"></div>

    <label class="check">
      <input id="isPremium" type="checkbox">
      💎 Premium кино
    </label>

    <label class="check">
      <input id="isFeatured" type="checkbox">
      ⭐ Нүүр хуудсанд онцлох
    </label>

    <button id="addButton" class="add" onclick="addMovie()">
      🎬 Кино нэмэх
    </button>

    <div id="progress" class="progress">
      ⏳ Файл upload хийж байна...
    </div>
  </div>


  <div class="card">
    <h2>🎞️ Кинонууд</h2>
    <div id="moviesList">
      Ачааллаж байна...
    </div>
  </div>

</main>


<script>

const SUPABASE_URL = "https://idjqvulwffvtqplwmamt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_XsH8zpr25shhUUDjMEo0cQ_e5df7co5";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


function showStatus(message, type) {

  const box = document.getElementById("status");

  box.textContent = message;

  box.className = "status " + type;

  box.style.display = "block";

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


function showFileName(inputId, outputId) {

  const input = document.getElementById(inputId);

  const output = document.getElementById(outputId);

  if (input.files.length > 0) {

    output.textContent =
      "Сонгосон файл: " + input.files[0].name;

  } else {

    output.textContent = "";

  }
}


async function checkAdmin() {

  const {
    data: { user },
    error
  } = await supabaseClient.auth.getUser();

  if (error || !user) {

    window.location.href = "login.html";

    return false;
  }


  const {
    data: admin,
    error: adminError
  } =
    await supabaseClient
      .from("admin_users")
      .select("user_id")
      .eq("user_id", user.id)
      .maybeSingle();


  if (adminError || !admin) {

    document.body.innerHTML = `
      <div style="
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        background:#080808;
        color:white;
        font-family:Arial;
        text-align:center;
        padding:30px;
      ">
        <div>
          <h1>⛔ Admin эрх байхгүй</h1>
          <p>Энэ хэсэг зөвхөн Admin хэрэглэгчид зориулагдсан.</p>
          <a href="index.html" style="color:#e50914;">
            BANO нүүр хуудас
          </a>
        </div>
      </div>
    `;

    return false;
  }


  return true;
}


async function uploadFile(bucket, file) {

  if (!file) {
    throw new Error("Файл сонгоогүй байна.");
  }


  const extension =
    file.name.split(".").pop().toLowerCase();


  const randomName =
    crypto.randomUUID() +
    "." +
    extension;


  const filePath = randomName;


  const {
    error
  } =
    await supabaseClient.storage
      .from(bucket)
      .upload(
        filePath,
        file,
        {
          cacheControl: "3600",
          upsert: false
        }
      );


  if (error) {

    throw error;

  }


  const {
    data
  } =
    supabaseClient.storage
      .from(bucket)
      .getPublicUrl(filePath);


  return data.publicUrl;
}


async function addMovie() {

  const button =
    document.getElementById("addButton");

  const progress =
    document.getElementById("progress");


  const title =
    document.getElementById("title").value.trim();

  const description =
    document.getElementById("description").value.trim();

  const category =
    document.getElementById("category").value;

  const year =
    document.getElementById("year").value;

  const posterFile =
    document.getElementById("posterFile").files[0];

  const videoFile =
    document.getElementById("videoFile").files[0];

  const isPremium =
    document.getElementById("isPremium").checked;

  const isFeatured =
    document.getElementById("isFeatured").checked;


  if (!title) {

    showStatus(
      "❌ Киноны нэрээ оруулна уу.",
      "error"
    );

    return;
  }


  if (!posterFile) {

    showStatus(
      "❌ Poster зураг сонгоно уу.",
      "error"
    );

    return;
  }


  if (!videoFile) {

    showStatus(
      "❌ Киноны видео файл сонгоно уу.",
      "error"
    );

    return;
  }


  try {

    button.disabled = true;

    progress.style.display = "block";


    progress.textContent =
      "⏳ Poster upload хийж байна...";


    const posterUrl =
      await uploadFile(
        "posters",
        posterFile
      );


    progress.textContent =
      "⏳ Видео upload хийж байна...";


    const videoUrl =
      await uploadFile(
        "videos",
        videoFile
      );


    progress.textContent =
      "⏳ Кино мэдээллийг хадгалж байна...";


    const {
      data: { user }
    } =
      await supabaseClient.auth.getUser();


    const {
      error
    } =
      await supabaseClient
        .from("movies")
        .insert({

          title: title,

          description: description,

          poster_url: posterUrl,

          video_url: videoUrl,

          category: category,

          year: year
            ? Number(year)
            : null,

          is_premium: isPremium,

          is_featured: isFeatured,

          created_by: user.id

        });


    if (error) {

      throw error;

    }


    showStatus(
      "✅ Кино амжилттай нэмэгдлээ!",
      "success"
    );


    document.getElementById("title").value = "";

    document.getElementById("description").value = "";

    document.getElementById("year").value = "";

    document.getElementById("posterFile").value = "";

    document.getElementById("videoFile").value = "";

    document.getElementById("posterName").textContent = "";

    document.getElementById("videoName").textContent = "";

    document.getElementById("isPremium").checked = false;

    document.getElementById("isFeatured").checked = false;


    await loadMovies();


  } catch (error) {

    console.error(error);

    showStatus(
      "❌ Алдаа: " + error.message,
      "error"
    );


  } finally {

    button.disabled = false;

    progress.style.display = "none";

  }

}


async function loadMovies() {

  const list =
    document.getElementById("moviesList");


  const {
    data,
    error
  } =
    await supabaseClient
      .from("movies")
      .select("*")
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    list.innerHTML =
      "❌ Кино ачаалахад алдаа гарлаа.";

    return;
  }


  if (!data || data.length === 0) {

    list.innerHTML =
      "Одоогоор кино алга.";

    return;
  }


  list.innerHTML = "";


  data.forEach(movie => {

    const item =
      document.createElement("div");

    item.className = "movie";


    const img =
      document.createElement("img");

    img.className = "poster";

    img.src =
      movie.poster_url ||
      "";

    img.alt =
      movie.title;

    img.onerror = function() {

      this.style.visibility = "hidden";

    };


    const info =
      document.createElement("div");

    info.className = "movie-info";


    const title =
      document.createElement("div");

    title.className = "movie-title";

    title.textContent =
      movie.title;


    const meta =
      document.createElement("div");

    meta.className = "movie-meta";

    meta.innerHTML = `

      ${movie.category || ""}

      ${movie.year ? " • " + movie.year : ""}

      <br>

      ${
        movie.is_premium
        ? '<span class="premium">💎 Premium</span>'
        : "🆓 Үнэгүй"
      }

      &nbsp;

      ${
        movie.is_featured
        ? '<span class="featured">⭐ Онцлох</span>'
        : ""
      }

    `;


    info.appendChild(title);

    info.appendChild(meta);


    const deleteButton =
      document.createElement("button");

    deleteButton.className = "delete";

    deleteButton.textContent =
      "🗑️ Устгах";


    deleteButton.onclick =
      () => deleteMovie(movie);


    item.appendChild(img);

    item.appendChild(info);

    item.appendChild(deleteButton);


    list.appendChild(item);

  });

}


async function deleteMovie(movie) {

  const ok =
    confirm(
      `"${movie.title}" киног устгах уу?`
    );


  if (!ok) return;


  try {

    const {
      error
    } =
      await supabaseClient
        .from("movies")
        .delete()
        .eq("id", movie.id);


    if (error) {

      throw error;

    }


    showStatus(
      "✅ Кино устгагдлаа.",
      "success"
    );


    await loadMovies();


  } catch (error) {

    showStatus(
      "❌ Устгахад алдаа гарлаа: " +
      error.message,
      "error"
    );

  }

}


async function logout() {

  await supabaseClient.auth.signOut();

  window.location.href =
    "login.html";

}


(async function() {

  const isAdmin =
    await checkAdmin();

  if (isAdmin) {

    await loadMovies();

  }

})();

</script>

</body>
</html>
