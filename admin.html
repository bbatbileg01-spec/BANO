<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BANO+ Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#070707;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

.header{
  height:70px;
  background:#0b0b0b;
  border-bottom:1px solid #252525;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 5%;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  font-size:27px;
  font-weight:900;
  letter-spacing:2px;
}

.logo span{
  color:#e50914;
}

.header-right{
  display:flex;
  align-items:center;
  gap:15px;
}

.back{
  color:#aaa;
  text-decoration:none;
  font-size:14px;
}

.back:hover{
  color:#fff;
}

.logout{
  background:#222;
  color:#fff;
  border:1px solid #333;
  border-radius:7px;
  padding:9px 14px;
  cursor:pointer;
}

.container{
  width:92%;
  max-width:1200px;
  margin:auto;
  padding:35px 0 70px;
}

.top-title{
  margin-bottom:30px;
}

.top-title h1{
  font-size:34px;
  margin-bottom:8px;
}

.top-title p{
  color:#888;
}

.admin-badge{
  display:inline-block;
  margin-top:12px;
  padding:7px 12px;
  border-radius:6px;
  background:#e50914;
  font-size:12px;
  font-weight:bold;
}

.card{
  background:#111;
  border:1px solid #272727;
  border-radius:14px;
  padding:25px;
  margin-bottom:25px;
}

.card h2{
  font-size:21px;
  margin-bottom:20px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.field{
  margin-bottom:17px;
}

.field.full{
  grid-column:1 / -1;
}

label{
  display:block;
  color:#bbb;
  font-size:13px;
  margin-bottom:7px;
}

input[type="text"],
input[type="number"],
textarea,
select{
  width:100%;
  background:#080808;
  color:#fff;
  border:1px solid #333;
  border-radius:8px;
  padding:12px;
  outline:none;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#e50914;
}

textarea{
  min-height:110px;
  resize:vertical;
}

input[type="file"]{
  width:100%;
  background:#080808;
  color:#aaa;
  border:1px dashed #444;
  border-radius:8px;
  padding:12px;
}

.options{
  display:flex;
  flex-wrap:wrap;
  gap:20px;
  margin:10px 0 20px;
}

.check{
  display:flex;
  align-items:center;
  gap:8px;
  color:#ccc;
  font-size:14px;
}

.check input{
  width:17px;
  height:17px;
  accent-color:#e50914;
}

.btn{
  border:0;
  border-radius:8px;
  padding:12px 20px;
  background:#e50914;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

.btn:hover{
  opacity:.9;
}

.btn.secondary{
  background:#292929;
}

.btn.gold{
  background:#d4a62a;
  color:#111;
}

.message{
  margin-top:15px;
  padding:13px;
  border-radius:8px;
  display:none;
  font-size:14px;
}

.message.success{
  display:block;
  background:#12351e;
  color:#76e69b;
  border:1px solid #1d6835;
}

.message.error{
  display:block;
  background:#351414;
  color:#ff8989;
  border:1px solid #6a2020;
}

.movie-list{
  display:grid;
  gap:15px;
}

.movie-item{
  display:grid;
  grid-template-columns:90px 1fr auto;
  gap:17px;
  align-items:center;
  background:#090909;
  border:1px solid #292929;
  border-radius:10px;
  padding:12px;
}

.movie-poster{
  width:90px;
  height:125px;
  object-fit:cover;
  border-radius:7px;
  background:#191919;
}

.movie-info h3{
  font-size:17px;
  margin-bottom:8px;
}

.movie-info p{
  color:#888;
  font-size:13px;
  line-height:1.5;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:9px;
}

.tag{
  background:#252525;
  color:#bbb;
  padding:4px 7px;
  border-radius:4px;
  font-size:10px;
}

.tag.premium{
  background:#d4a62a;
  color:#111;
}

.tag.featured{
  background:#e50914;
  color:#fff;
}

.actions{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.small-btn{
  border:0;
  border-radius:6px;
  padding:8px 12px;
  cursor:pointer;
  font-size:12px;
  color:#fff;
  background:#292929;
}

.small-btn.edit{
  background:#333;
}

.small-btn.delete{
  background:#8b151b;
}

.empty{
  text-align:center;
  padding:50px 20px;
  color:#777;
}

.loading{
  text-align:center;
  color:#777;
  padding:40px;
}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:500;
  padding:20px;
}

.modal{
  width:100%;
  max-width:500px;
  background:#111;
  border:1px solid #333;
  border-radius:14px;
  padding:25px;
}

.modal h2{
  margin-bottom:15px;
}

.modal p{
  color:#aaa;
  line-height:1.6;
  margin-bottom:20px;
}

.modal-buttons{
  display:flex;
  gap:10px;
  justify-content:flex-end;
}

@media(max-width:700px){

  .header{
    padding:0 18px;
  }

  .logo{
    font-size:22px;
  }

  .back{
    display:none;
  }

  .container{
    width:94%;
    padding-top:25px;
  }

  .top-title h1{
    font-size:28px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .movie-item{
    grid-template-columns:70px 1fr;
  }

  .movie-poster{
    width:70px;
    height:100px;
  }

  .actions{
    grid-column:1 / -1;
    flex-direction:row;
  }

  .small-btn{
    flex:1;
  }
}
</style>
</head>

<body>

<header class="header">

  <div class="logo">
    BANO<span>+</span>
  </div>

  <div class="header-right">

    <a
      class="back"
      href="index.html"
    >
      ← Сайт руу
    </a>

    <button
      class="logout"
      onclick="logout()"
    >
      Гарах
    </button>

  </div>

</header>


<main class="container">

  <div class="top-title">

    <h1>🎬 Кино удирдлага</h1>

    <p>
      BANO+ кино сангаа эндээс удирдана.
    </p>

    <div class="admin-badge">
      👑 ADMIN
    </div>

  </div>


  <!-- ADD MOVIE -->

  <section class="card">

    <h2 id="formTitle">
      ➕ Шинэ кино нэмэх
    </h2>

    <div class="grid">

      <div class="field">

        <label>
          Киноны нэр
        </label>

        <input
          id="title"
          type="text"
          placeholder="Жишээ: Avatar"
        >

      </div>


      <div class="field">

        <label>
          Он
        </label>

        <input
          id="year"
          type="number"
          placeholder="2026"
        >

      </div>


      <div class="field">

        <label>
          Ангилал
        </label>

        <input
          id="category"
          type="text"
          placeholder="Action, Drama..."
        >

      </div>


      <div class="field">

        <label>
          Постер URL (хэрэв upload хийхгүй бол)
        </label>

        <input
          id="posterUrl"
          type="text"
          placeholder="https://..."
        >

      </div>


      <div class="field full">

        <label>
          Тайлбар
        </label>

        <textarea
          id="description"
          placeholder="Киноны тайлбар..."
        ></textarea>

      </div>


      <div class="field">

        <label>
          🖼️ Постер файл
        </label>

        <input
          id="posterFile"
          type="file"
          accept="image/*"
        >

      </div>


      <div class="field">

        <label>
          🎥 Видео файл
        </label>

        <input
          id="videoFile"
          type="file"
          accept="video/*"
        >

      </div>

    </div>


    <div class="options">

      <label class="check">

        <input
          id="isPremium"
          type="checkbox"
        >

        💎 Premium кино

      </label>


      <label class="check">

        <input
          id="isFeatured"
          type="checkbox"
        >

        ⭐ Онцлох кино

      </label>

    </div>


    <div>

      <button
        id="saveBtn"
        class="btn"
        onclick="saveMovie()"
      >
        🎬 Кино нэмэх
      </button>


      <button
        id="cancelBtn"
        class="btn secondary"
        onclick="cancelEdit()"
        style="display:none;margin-left:8px;"
      >
        Болих
      </button>

    </div>


    <div
      id="message"
      class="message"
    ></div>

  </section>


  <!-- MOVIE LIST -->

  <section class="card">

    <h2>
      📚 Киноны сан
    </h2>

    <div
      id="movieList"
      class="movie-list"
    >

      <div class="loading">
        Кинонууд ачаалж байна...
      </div>

    </div>

  </section>

</main>


<!-- DELETE MODAL -->

<div
  id="deleteOverlay"
  class="overlay"
>

  <div class="modal">

    <h2>
      🗑️ Кино устгах уу?
    </h2>

    <p id="deleteText">
      Энэ үйлдлийг буцаах боломжгүй.
    </p>

    <div class="modal-buttons">

      <button
        class="btn secondary"
        onclick="closeDeleteModal()"
      >
        Болих
      </button>

      <button
        class="btn"
        onclick="confirmDelete()"
      >
        Устгах
      </button>

    </div>

  </div>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  "https://idjqvulwffvtqplwmamt.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_XsH8zpr25shhUUDjMEo0cQ_e5df7co5";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================
   ADMIN
========================================= */

let currentUser = null;

let editingId = null;

let deleteId = null;


/* =========================================
   START
========================================= */

checkAdmin();


/* =========================================
   CHECK ADMIN
========================================= */

async function checkAdmin(){

  const {
    data:{
      user
    }
  } =
    await supabaseClient.auth.getUser();


  if(!user){

    window.location.href =
      "login.html";

    return;

  }


  currentUser =
    user;


  const {
    data:admin,
    error
  } =
    await supabaseClient
      .from("admin_users")
      .select("user_id")
      .eq("user_id",user.id)
      .maybeSingle();


  if(error || !admin){

    alert(
      "Танд Admin эрх байхгүй байна."
    );

    window.location.href =
      "index.html";

    return;

  }


  loadMovies();

}


/* =========================================
   LOAD MOVIES
========================================= */

async function loadMovies(){

  const list =
    document.getElementById(
      "movieList"
    );


  list.innerHTML =
    '<div class="loading">Кинонууд ачаалж байна...</div>';


  const {
    data,
    error
  } =
    await supabaseClient
      .from("movies")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(error){

    console.error(error);

    list.innerHTML =
      '<div class="empty">Кино ачааллахад алдаа гарлаа.</div>';

    return;

  }


  if(!data || data.length === 0){

    list.innerHTML =
      '<div class="empty">Одоогоор кино байхгүй байна.</div>';

    return;

  }


  list.innerHTML =
    "";


  data.forEach(movie => {

    const item =
      document.createElement(
        "div"
      );

    item.className =
      "movie-item";


    const poster =
      movie.poster_url
      ? `<img class="movie-poster" src="${escapeHtml(movie.poster_url)}" alt="">`
      : `<div class="movie-poster" style="display:flex;align-items:center;justify-content:center;font-size:35px;">🎬</div>`;


    const tags = `

      ${
        movie.is_premium
        ? '<span class="tag premium">💎 PREMIUM</span>'
        : '<span class="tag">FREE</span>'
      }

      ${
        movie.is_featured
        ? '<span class="tag featured">⭐ ОНЦЛОХ</span>'
        : ''
      }

      ${
        movie.category
        ? `<span class="tag">${escapeHtml(movie.category)}</span>`
        : ''
      }

      ${
        movie.year
        ? `<span class="tag">${movie.year}</span>`
        : ''
      }

    `;


    item.innerHTML = `

      ${poster}

      <div class="movie-info">

        <h3>
          ${escapeHtml(movie.title || "Нэргүй кино")}
        </h3>

        <p>
          ${escapeHtml(
            movie.description ||
            "Тайлбар байхгүй."
          )}
        </p>

        <div class="tags">
          ${tags}
        </div>

      </div>


      <div class="actions">

        <button
          class="small-btn edit"
          onclick="editMovie(${movie.id})"
        >
          ✏️ Засах
        </button>

        <button
          class="small-btn delete"
          onclick="openDeleteModal(${movie.id}, '${escapeJs(movie.title || "кино")}')"
        >
          🗑️ Устгах
        </button>

      </div>

    `;


    list.appendChild(item);

  });

}


/* =========================================
   SAVE MOVIE
========================================= */

async function saveMovie(){

  const title =
    document.getElementById(
      "title"
    ).value.trim();


  const description =
    document.getElementById(
      "description"
    ).value.trim();


  const category =
    document.getElementById(
      "category"
    ).value.trim();


  const yearValue =
    document.getElementById(
      "year"
    ).value;


  const posterUrl =
    document.getElementById(
      "posterUrl"
    ).value.trim();


  const posterFile =
    document.getElementById(
      "posterFile"
    ).files[0];


  const videoFile =
    document.getElementById(
      "videoFile"
    ).files[0];


  const isPremium =
    document.getElementById(
      "isPremium"
    ).checked;


  const isFeatured =
    document.getElementById(
      "isFeatured"
    ).checked;


  if(!title){

    showMessage(
      "Киноны нэр оруулна уу.",
      "error"
    );

    return;

  }


  const saveBtn =
    document.getElementById(
      "saveBtn"
    );


  saveBtn.disabled =
    true;

  saveBtn.textContent =
    "⏳ Хадгалж байна...";


  try{

    let finalPosterUrl =
      posterUrl || null;

    let finalVideoUrl =
      null;


    /* ==========================
       POSTER UPLOAD
    ========================== */

    if(posterFile){

      const posterPath =
        "poster_" +
        Date.now() +
        "_" +
        cleanFileName(
          posterFile.name
        );


      const {
        error:
        posterError
      } =
        await supabaseClient
          .storage
          .from("posters")
          .upload(
            posterPath,
            posterFile,
            {
              upsert:false
            }
          );


      if(posterError){

        throw posterError;

      }


      const {
        data:
        posterData
      } =
        supabaseClient
          .storage
          .from("posters")
          .getPublicUrl(
            posterPath
          );


      finalPosterUrl =
        posterData.publicUrl;

    }


    /* ==========================
       VIDEO UPLOAD
    ========================== */

    if(videoFile){

      const videoPath =
        "video_" +
        Date.now() +
        "_" +
        cleanFileName(
          videoFile.name
        );


      const {
        error:
        videoError
      } =
        await supabaseClient
          .storage
          .from("videos")
          .upload(
            videoPath,
            videoFile,
            {
              upsert:false
            }
          );


      if(videoError){

        throw videoError;

      }


      /*
        Private bucket тулд
        Storage object URL хадгална.
      */

      finalVideoUrl =
        SUPABASE_URL +
        "/storage/v1/object/videos/" +
        videoPath;

    }


    /* ==========================
       UPDATE
    ========================== */

    if(editingId){

      const updateData = {

        title:title,

        description:
          description || null,

        category:
          category || null,

        year:
          yearValue
          ? Number(yearValue)
          : null,

        is_premium:
          isPremium,

        is_featured:
          isFeatured,

        updated_at:
          new Date().toISOString()

      };


      if(finalPosterUrl){

        updateData.poster_url =
          finalPosterUrl;

      }


      if(finalVideoUrl){

        updateData.video_url =
          finalVideoUrl;

      }


      const {
        error
      } =
        await supabaseClient
          .from("movies")
          .update(updateData)
          .eq(
            "id",
            editingId
          );


      if(error){

        throw error;

      }


      showMessage(
        "✅ Кино амжилттай шинэчлэгдлээ.",
        "success"
      );

    }

    /* ==========================
       INSERT
    ========================== */

    else{

      const {
        error
      } =
        await supabaseClient
          .from("movies")
          .insert({

            title:title,

            description:
              description || null,

            poster_url:
              finalPosterUrl,

            video_url:
              finalVideoUrl,

            category:
              category || null,

            year:
              yearValue
              ? Number(yearValue)
              : null,

            is_premium:
              isPremium,

            is_featured:
              isFeatured,

            created_by:
              currentUser.id

          });


      if(error){

        throw error;

      }


      showMessage(
        "✅ Кино амжилттай нэмэгдлээ.",
        "success"
      );

    }


    resetForm();

    loadMovies();


  }
  catch(error){

    console.error(error);

    showMessage(
      "❌ Алдаа: " +
      (error.message || "Тодорхойгүй алдаа"),
      "error"
    );

  }
  finally{

    saveBtn.disabled =
      false;

    saveBtn.textContent =
      editingId
      ? "💾 Хадгалах"
      : "🎬 Кино нэмэх";

  }

}


/* =========================================
   EDIT MOVIE
========================================= */

async function editMovie(id){

  const {
    data:movie,
    error
  } =
    await supabaseClient
      .from("movies")
      .select("*")
      .eq("id",id)
      .single();


  if(error || !movie){

    alert(
      "Кино олдсонгүй."
    );

    return;

  }


  editingId =
    id;


  document.getElementById(
    "title"
  ).value =
    movie.title || "";


  document.getElementById(
    "description"
  ).value =
    movie.description || "";


  document.getElementById(
    "category"
  ).value =
    movie.category || "";


  document.getElementById(
    "year"
  ).value =
    movie.year || "";


  document.getElementById(
    "posterUrl"
  ).value =
    movie.poster_url || "";


  document.getElementById(
    "isPremium"
  ).checked =
    !!movie.is_premium;


  document.getElementById(
    "isFeatured"
  ).checked =
    !!movie.is_featured;


  document.getElementById(
    "formTitle"
  ).textContent =
    "✏️ Кино засах";


  document.getElementById(
    "saveBtn"
  ).textContent =
    "💾 Хадгалах";


  document.getElementById(
    "cancelBtn"
  ).style.display =
    "inline-block";


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================================
   CANCEL EDIT
========================================= */

function cancelEdit(){

  resetForm();

}


/* =========================================
   RESET
========================================= */

function resetForm(){

  editingId =
    null;


  document.getElementById(
    "title"
  ).value =
    "";


  document.getElementById(
    "description"
  ).value =
    "";


  document.getElementById(
    "category"
  ).value =
    "";


  document.getElementById(
    "year"
  ).value =
    "";


  document.getElementById(
    "posterUrl"
  ).value =
    "";


  document.getElementById(
    "posterFile"
  ).value =
    "";


  document.getElementById(
    "videoFile"
  ).value =
    "";


  document.getElementById(
    "isPremium"
  ).checked =
    false;


  document.getElementById(
    "isFeatured"
  ).checked =
    false;


  document.getElementById(
    "formTitle"
  ).textContent =
    "➕ Шинэ кино нэмэх";


  document.getElementById(
    "saveBtn"
  ).textContent =
    "🎬 Кино нэмэх";


  document.getElementById(
    "cancelBtn"
  ).style.display =
    "none";

}


/* =========================================
   DELETE MODAL
========================================= */

function openDeleteModal(
  id,
  title
){

  deleteId =
    id;


  document.getElementById(
    "deleteText"
  ).textContent =
    `"${title}" киног устгах уу? Энэ үйлдлийг буцаах боломжгүй.`;


  document.getElementById(
    "deleteOverlay"
  ).style.display =
    "flex";

}


function closeDeleteModal(){

  deleteId =
    null;


  document.getElementById(
    "deleteOverlay"
  ).style.display =
    "none";

}


/* =========================================
   CONFIRM DELETE
========================================= */

async function confirmDelete(){

  if(!deleteId){

    return;

  }


  const id =
    deleteId;


  closeDeleteModal();


  const {
    error
  } =
    await supabaseClient
      .from("movies")
      .delete()
      .eq(
        "id",
        id
      );


  if(error){

    console.error(error);

    showMessage(
      "❌ Кино устгахад алдаа гарлаа: " +
      error.message,
      "error"
    );

    return;

  }


  showMessage(
    "✅ Кино устгагдлаа.",
    "success"
  );


  loadMovies();

}


/* =========================================
   LOGOUT
========================================= */

async function logout(){

  await supabaseClient.auth.signOut();

  window.location.href =
    "index.html";

}


/* =========================================
   MESSAGE
========================================= */

function showMessage(
  text,
  type
){

  const message =
    document.getElementById(
      "message"
    );


  message.textContent =
    text;


  message.className =
    "message " +
    type;


  setTimeout(
    () => {

      message.className =
        "message";

    },
    5000
  );

}


/* =========================================
   FILE NAME
========================================= */

function cleanFileName(
  name
){

  return name
    .replace(
      /[^a-zA-Z0-9._-]/g,
      "_"
    );

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(
  value
){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }


  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================
   ESCAPE JS
========================================= */

function escapeJs(
  value
){

  return String(value)
    .replace(
      /\\/g,
      "\\\\"
    )
    .replace(
      /'/g,
      "\\'"
    )
    .replace(
      /"/g,
      '\\"'
    )
    .replace(
      /\n/g,
      "\\n"
    )
    .replace(
      /\r/g,
      "\\r"
    );

}
