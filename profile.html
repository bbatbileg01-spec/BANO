<!DOCTYPE html>
<html lang="mn">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>BANO+ Profile</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#080808;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

button{
  font:inherit;
  cursor:pointer;
}

a{
  text-decoration:none;
}

/* =========================
   HEADER
========================= */

.header{
  height:70px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 5%;

  background:#0b0b0b;

  border-bottom:1px solid #222;

  position:sticky;
  top:0;
  z-index:1000;
}

.logo{
  color:#fff;

  font-size:28px;
  font-weight:900;

  letter-spacing:2px;
}

.logo span{
  color:#e50914;
}

.back-btn{
  color:#bbb;

  border:1px solid #333;

  background:#151515;

  padding:9px 15px;

  border-radius:7px;

  font-size:13px;
}

.back-btn:hover{
  color:#fff;
  border-color:#e50914;
}

/* =========================
   MAIN
========================= */

.container{
  width:90%;
  max-width:1100px;

  margin:40px auto 70px;
}

/* =========================
   PROFILE HEADER
========================= */

.profile-header{
  background:
    linear-gradient(
      135deg,
      #171717,
      #0e0e0e
    );

  border:1px solid #292929;

  border-radius:16px;

  padding:30px;

  display:flex;

  align-items:center;

  gap:22px;

  margin-bottom:25px;
}

.avatar{
  width:75px;
  height:75px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#e50914;

  color:#fff;

  font-size:30px;

  font-weight:bold;

  flex-shrink:0;
}

.profile-info{
  min-width:0;
}

.profile-info h1{
  font-size:25px;

  margin-bottom:7px;
}

.email{
  color:#999;

  font-size:14px;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;
}

/* =========================
   CARDS
========================= */

.card{
  background:#111;

  border:1px solid #292929;

  border-radius:14px;

  padding:25px;

  margin-bottom:25px;
}

.card-title{
  font-size:20px;

  font-weight:bold;

  margin-bottom:20px;
}

/* =========================
   PREMIUM
========================= */

.premium-card{
  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:20px;
}

.premium-left{
  display:flex;

  align-items:center;

  gap:15px;
}

.premium-icon{
  width:50px;
  height:50px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:12px;

  background:#d4a62a;

  color:#111;

  font-size:22px;
}

.premium-title{
  font-size:16px;

  font-weight:bold;

  margin-bottom:6px;
}

.premium-status{
  color:#999;

  font-size:13px;
}

.premium-active{
  color:#d4a62a;
}

.premium-expired{
  color:#e50914;
}

.premium-btn{
  background:#d4a62a;

  color:#111;

  border:0;

  padding:11px 18px;

  border-radius:8px;

  font-weight:bold;
}

.premium-btn:hover{
  background:#edc33b;
}

/* =========================
   MOVIE GRID
========================= */

.movie-grid{
  display:grid;

  grid-template-columns:
    repeat(5,1fr);

  gap:18px;
}

.movie-card{
  background:#151515;

  border:1px solid #242424;

  border-radius:10px;

  overflow:hidden;

  cursor:pointer;

  transition:.2s;

  position:relative;
}

.movie-card:hover{
  transform:translateY(-5px);

  border-color:#444;
}

.poster{
  width:100%;

  aspect-ratio:2/3;

  background:#202020;

  position:relative;

  overflow:hidden;
}

.poster img{
  width:100%;
  height:100%;

  object-fit:cover;

  display:block;
}

.no-poster{
  width:100%;
  height:100%;

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:40px;
}

.movie-info{
  padding:12px;
}

.movie-title{
  font-size:14px;

  font-weight:bold;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.movie-meta{
  color:#777;

  font-size:11px;

  margin-top:6px;
}

.remove-btn{
  position:absolute;

  top:8px;
  right:8px;

  width:32px;
  height:32px;

  border:0;

  border-radius:50%;

  background:rgba(0,0,0,.8);

  color:#fff;

  font-size:15px;

  z-index:5;
}

.remove-btn:hover{
  background:#e50914;
}

/* =========================
   MY LIST
========================= */

.list-card{
  position:relative;
}

.list-open{
  width:100%;

  margin-top:10px;

  border:1px solid #333;

  background:#191919;

  color:#fff;

  padding:8px;

  border-radius:6px;

  font-size:12px;
}

.list-open:hover{
  background:#e50914;

  border-color:#e50914;
}

/* =========================
   EMPTY
========================= */

.empty{
  padding:40px 15px;

  text-align:center;

  color:#666;

  border:1px dashed #292929;

  border-radius:10px;

  line-height:1.6;
}

/* =========================
   LOGOUT
========================= */

.logout-section{
  text-align:center;

  margin-top:30px;
}

.logout-btn{
  border:1px solid #333;

  background:#151515;

  color:#fff;

  padding:11px 25px;

  border-radius:8px;
}

.logout-btn:hover{
  background:#e50914;

  border-color:#e50914;
}

/* =========================
   LOADING
========================= */

.loading{
  color:#888;

  text-align:center;

  padding:30px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:800px){

  .movie-grid{
    grid-template-columns:
      repeat(3,1fr);

    gap:12px;
  }

}

@media(max-width:600px){

  .header{
    height:62px;

    padding:0 18px;
  }

  .logo{
    font-size:22px;
  }

  .container{
    width:auto;

    margin:25px 18px 50px;
  }

  .profile-header{
    padding:22px;

    gap:15px;
  }

  .avatar{
    width:60px;
    height:60px;

    font-size:24px;
  }

  .profile-info h1{
    font-size:20px;
  }

  .email{
    font-size:12px;
  }

  .card{
    padding:18px;
  }

  .premium-card{
    display:block;
  }

  .premium-left{
    margin-bottom:18px;
  }

  .premium-btn{
    width:100%;
  }

  .movie-grid{
    grid-template-columns:
      repeat(2,1fr);

    gap:10px;
  }

  .movie-info{
    padding:9px;
  }

  .movie-title{
    font-size:12px;
  }

  .movie-meta{
    font-size:10px;
  }

}

</style>

</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header class="header">

  <div class="logo">
    BANO<span>+</span>
  </div>

  <a
    href="index.html"
    class="back-btn"
  >
    ← Нүүр
  </a>

</header>


<!-- =========================
     MAIN
========================= -->

<main class="container">


  <!-- PROFILE -->

  <section class="profile-header">

    <div
      class="avatar"
      id="avatar"
    >
      B
    </div>

    <div class="profile-info">

      <h1>
        Сайн байна уу 👋
      </h1>

      <div
        class="email"
        id="userEmail"
      >
        Ачаалж байна...
      </div>

    </div>

  </section>


  <!-- =========================
       PREMIUM
  ========================= -->

  <section class="card">

    <div class="premium-card">

      <div class="premium-left">

        <div class="premium-icon">
          💎
        </div>

        <div>

          <div class="premium-title">
            BANO Premium
          </div>

          <div
            class="premium-status"
            id="premiumStatus"
          >
            Шалгаж байна...
          </div>

        </div>

      </div>

      <button
        class="premium-btn"
        onclick="location.href='premium.html'"
      >
        Premium
      </button>

    </div>

  </section>


  <!-- =========================
       FAVORITES
  ========================= -->

  <section class="card">

    <div class="card-title">
      ❤️ Дуртай кинонууд
    </div>

    <div
      class="movie-grid"
      id="favoriteGrid"
    >

      <div class="loading">
        Ачаалж байна...
      </div>

    </div>

  </section>


  <!-- =========================
       MY LIST
  ========================= -->

  <section class="card">

    <div class="card-title">
      📋 Миний жагсаалт
    </div>

    <div
      class="movie-grid"
      id="myListGrid"
    >

      <div class="loading">
        Ачаалж байна...
      </div>

    </div>

  </section>


  <!-- =========================
       LOGOUT
  ========================= -->

  <div class="logout-section">

    <button
      class="logout-btn"
      onclick="logout()"
    >
      🚪 Гарах
    </button>

  </div>


</main>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://idjqvulwffvtqplwmamt.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_XsH8zpr25shhUUDjMEo0cQ_e5df7co5";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   USER
========================= */

let currentUser = null;


/* =========================
   START
========================= */

async function start(){

  const {
    data:{
      user
    }
  } =
  await supabaseClient.auth.getUser();


  if(!user){

    window.location.href =
      "login.html";

    return;

  }


  currentUser =
    user;


  showUser();

  await loadPremium();

  await loadFavorites();

  await loadMyList();

}


/* =========================
   SHOW USER
========================= */

function showUser(){

  const email =
    currentUser.email ||
    "Хэрэглэгч";


  document.getElementById(
    "userEmail"
  ).textContent =
    email;


  const firstLetter =
    email
      .charAt(0)
      .toUpperCase();


  document.getElementById(
    "avatar"
  ).textContent =
    firstLetter;

}


/* =========================
   PREMIUM
========================= */

async function loadPremium(){

  const status =
    document.getElementById(
      "premiumStatus"
    );


  const {
    data,
    error
  } =
  await supabaseClient
    .from("user_premium")
    .select(
      "premium_until"
    )
    .eq(
      "user_id",
      currentUser.id
    )
    .maybeSingle();


  if(error){

    console.error(
      "Premium error:",
      error
    );

    status.textContent =
      "Premium мэдээлэл ачааллахад алдаа гарлаа.";

    status.className =
      "premium-status premium-expired";

    return;

  }


  if(
    !data ||
    !data.premium_until
  ){

    status.textContent =
      "Premium идэвхгүй";

    status.className =
      "premium-status premium-expired";

    return;

  }


  const premiumUntil =
    new Date(
      data.premium_until
    );


  const now =
    new Date();


  if(
    premiumUntil > now
  ){

    const dateText =
      premiumUntil.toLocaleDateString(
        "mn-MN",
        {
          year:"numeric",
          month:"long",
          day:"numeric"
        }
      );


    status.textContent =
      "Идэвхтэй • " +
      dateText +
      " хүртэл";

    status.className =
      "premium-status premium-active";

  }else{

    status.textContent =
      "Premium хугацаа дууссан";

    status.className =
      "premium-status premium-expired";

  }

}


/* =========================
   FAVORITES
========================= */

async function loadFavorites(){

  const grid =
    document.getElementById(
      "favoriteGrid"
    );


  grid.innerHTML =
    '<div class="loading">Ачаалж байна...</div>';


  const {
    data,
    error
  } =
  await supabaseClient
    .from("favorites")
    .select(`
      id,
      movie_id,
      movies (
        id,
        title,
        poster_url,
        category,
        year
      )
    `)
    .eq(
      "user_id",
      currentUser.id
    )
    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if(error){

    console.error(
      "Favorites error:",
      error
    );

    grid.innerHTML =
      '<div class="empty">❤️ Дуртай кино ачааллахад алдаа гарлаа.</div>';

    return;

  }


  if(
    !data ||
    data.length === 0
  ){

    grid.innerHTML =
      `
      <div class="empty">
        ❤️<br><br>
        Та одоогоор дуртай кино нэмээгүй байна.
      </div>
      `;

    return;

  }


  grid.innerHTML =
    "";


  data.forEach(
    item => {

      if(!item.movies){
        return;
      }


      const movie =
        item.movies;


      const card =
        createMovieCard(
          movie,
          item.id,
          true
        );


      grid.appendChild(
        card
      );

    }
  );

}


/* =========================
   MY LIST
========================= */

async function loadMyList(){

  const grid =
    document.getElementById(
      "myListGrid"
    );


  grid.innerHTML =
    '<div class="loading">Ачаалж байна...</div>';


  const {
    data,
    error
  } =
  await supabaseClient
    .from("my_list")
    .select("*")
    .eq(
      "user_id",
      currentUser.id
    )
    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if(error){

    console.error(
      "My list error:",
      error
    );

    grid.innerHTML =
      '<div class="empty">📋 Жагсаалт ачааллахад алдаа гарлаа.</div>';

    return;

  }


  if(
    !data ||
    data.length === 0
  ){

    grid.innerHTML =
      `
      <div class="empty">
        📋<br><br>
        Таны жагсаалт хоосон байна.
      </div>
      `;

    return;

  }


  grid.innerHTML =
    "";


  for(
    const item of data
  ){

    const movieLink =
      item.movie_link;


    if(!movieLink){

      continue;

    }


    let movieId = null;


    try{

      const url =
        new URL(
          movieLink,
          window.location.origin
        );


      movieId =
        url.searchParams.get(
          "id"
        );

    }catch(error){

      console.error(error);

    }


    let movie = null;


    if(movieId){

      const {
        data:movieData
      } =
      await supabaseClient
        .from("movies")
        .select(`
          id,
          title,
          poster_url,
          category,
          year
        `)
        .eq(
          "id",
          movieId
        )
        .maybeSingle();


      movie =
        movieData;

    }


    if(movie){

      const card =
        createMovieCard(
          movie,
          item.id,
          false
        );


      grid.appendChild(
        card
      );

    }else{

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "movie-card";


      card.innerHTML =
        `
        <div class="poster">

          <div class="no-poster">
            🎬
          </div>

        </div>

        <div class="movie-info">

          <div class="movie-title">
            ${escapeHtml(
              item.movie_name ||
              "Кино"
            )}
          </div>

          <button
            class="list-open"
            onclick="window.location.href='${escapeJs(movieLink)}'"
          >
            ▶ Нээх
          </button>

        </div>
        `;


      grid.appendChild(
        card
      );

    }

  }


  if(
    grid.children.length === 0
  ){

    grid.innerHTML =
      `
      <div class="empty">
        📋<br><br>
        Таны жагсаалт хоосон байна.
      </div>
      `;

  }

}


/* =========================
   CREATE MOVIE CARD
========================= */

function createMovieCard(
  movie,
  itemId,
  isFavorite
){

  const card =
    document.createElement(
      "div"
    );


  card.className =
    "movie-card";


  card.onclick =
    function(){

      window.location.href =
        "movie.html?id=" +
        encodeURIComponent(
          movie.id
        );

    };


  const poster =
    movie.poster_url

    ?

    `
    <img
      src="${escapeHtml(
        movie.poster_url
      )}"
      alt="${escapeHtml(
        movie.title ||
        "Movie"
      )}"
      loading="lazy"
    >
    `

    :

    `
    <div class="no-poster">
      🎬
    </div>
    `;


  let removeButton =
    "";


  if(isFavorite){

    removeButton =
      `
      <button
        class="remove-btn"
        title="Дуртайгаас хасах"
        onclick="
          event.stopPropagation();
          removeFavorite('${escapeJs(itemId)}');
        "
      >
        ×
      </button>
      `;

  }else{

    removeButton =
      `
      <button
        class="remove-btn"
        title="Жагсаалтаас хасах"
        onclick="
          event.stopPropagation();
          removeMyList('${escapeJs(itemId)}');
        "
      >
        ×
      </button>
      `;

  }


  card.innerHTML =
    `

    <div class="poster">

      ${poster}

      ${removeButton}

    </div>

    <div class="movie-info">

      <div class="movie-title">
        ${escapeHtml(
          movie.title ||
          "Нэргүй кино"
        )}
      </div>

      <div class="movie-meta">

        ${
          movie.year ||
          ""
        }

        ${
          movie.year &&
          movie.category
            ? " • "
            : ""
        }

        ${escapeHtml(
          movie.category ||
          ""
        )}

      </div>

    </div>

    `;


  return card;

}


/* =========================
   REMOVE FAVORITE
========================= */

async function removeFavorite(
  favoriteId
){

  const {
    error
  } =
  await supabaseClient
    .from("favorites")
    .delete()
    .eq(
      "id",
      favoriteId
    )
    .eq(
      "user_id",
      currentUser.id
    );


  if(error){

    alert(
      "Дуртайгаас хасахад алдаа гарлаа."
    );

    console.error(error);

    return;

  }


  await loadFavorites();

}


/* =========================
   REMOVE MY LIST
========================= */

async function removeMyList(
  listId
){

  const {
    error
  } =
  await supabaseClient
    .from("my_list")
    .delete()
    .eq(
      "id",
      listId
    )
    .eq(
      "user_id",
      currentUser.id
    );


  if(error){

    alert(
      "Жагсаалтаас хасахад алдаа гарлаа."
    );

    console.error(error);

    return;

  }


  await loadMyList();

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(
  value
){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================
   ESCAPE JS
========================= */

function escapeJs(
  value
){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }


  return String(value)
    .replace(
      /\\/g,
      "\\\\"
    )
    .replace(
      /'/g,
      "\\'"
    )
    .replace(
      /"/g,
      '\\"'
    )
    .replace(
      /\n/g,
      "\\n"
    )
    .replace(
      /\r/g,
      "\\r"
    );

}


/* =========================
   LOGOUT
========================= */

async function logout(){

  await supabaseClient.auth.signOut();

  window.location.href =
    "index.html";

}


/* =========================
   START
========================= */

start();

</script>

</body>
</html>
