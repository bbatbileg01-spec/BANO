<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BANO — Нэвтрэх</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 50% 20%,#2b1800,#07080b 45%);
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
}

.login-box{
  width:420px;
  max-width:92%;
  background:#111318;
  border:1px solid #292c33;
  border-radius:18px;
  padding:40px;
  box-shadow:0 25px 80px rgba(0,0,0,.6);
}

.logo{
  text-align:center;
  font-size:38px;
  font-weight:900;
  letter-spacing:6px;
  margin-bottom:10px;
}

.logo span{
  color:#ff9d00;
}

.subtitle{
  text-align:center;
  color:#888;
  margin-bottom:32px;
}

.tabs{
  display:flex;
  background:#08090c;
  border-radius:10px;
  padding:4px;
  margin-bottom:25px;
}

.tab{
  width:50%;
  padding:11px;
  border:0;
  border-radius:8px;
  background:transparent;
  color:#777;
  cursor:pointer;
  font-weight:bold;
}

.tab.active{
  background:#ff9d00;
  color:#08090c;
}

.form{
  display:none;
}

.form.active{
  display:block;
}

label{
  display:block;
  color:#aaa;
  font-size:13px;
  margin-bottom:8px;
}

.input{
  width:100%;
  padding:14px;
  margin-bottom:18px;
  background:#08090c;
  border:1px solid #292c33;
  border-radius:9px;
  color:#fff;
  outline:none;
  font-size:15px;
}

.input:focus{
  border-color:#ff9d00;
}

.button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:9px;
  background:#ff9d00;
  color:#08090c;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.button:hover{
  background:#ffb52e;
}

.message{
  display:none;
  text-align:center;
  color:#ffb52e;
  margin-top:15px;
  font-size:14px;
}

.back{
  display:block;
  text-align:center;
  margin-top:25px;
  color:#777;
  text-decoration:none;
  font-size:14px;
}

.back:hover{
  color:#fff;
}
</style>
</head>

<body>

<div class="login-box">

  <div class="logo">
    BAN<span>O</span>
  </div>

  <div class="subtitle">
    Киноны ертөнцөд тавтай морил
  </div>

  <div class="tabs">

    <button
      class="tab active"
      onclick="showForm('login')"
      id="loginTab">
      Нэвтрэх
    </button>

    <button
      class="tab"
      onclick="showForm('register')"
      id="registerTab">
      Бүртгүүлэх
    </button>

  </div>


  <!-- НЭВТРЭХ -->

  <div
    class="form active"
    id="loginForm">

    <label>И-мэйл</label>

    <input
      class="input"
      type="email"
      id="loginEmail"
      placeholder="example@gmail.com">

    <label>Нууц үг</label>

    <input
      class="input"
      type="password"
      id="loginPassword"
      placeholder="Нууц үгээ оруулна уу">

    <button
      class="button"
      onclick="login()">
      Нэвтрэх
    </button>

    <div
      class="message"
      id="loginMessage">
    </div>

  </div>


  <!-- БҮРТГҮҮЛЭХ -->

  <div
    class="form"
    id="registerForm">

    <label>Нэр</label>

    <input
      class="input"
      type="text"
      id="registerName"
      placeholder="Таны нэр">

    <label>И-мэйл</label>

    <input
      class="input"
      type="email"
      id="registerEmail"
      placeholder="example@gmail.com">

    <label>Нууц үг</label>

    <input
      class="input"
      type="password"
      id="registerPassword"
      placeholder="Нууц үг үүсгэнэ үү">

    <button
      class="button"
      onclick="register()">
      Бүртгэл үүсгэх
    </button>

    <div
      class="message"
      id="registerMessage">
    </div>

  </div>

  <a
    class="back"
    href="index.html">
    ← BANO нүүр хуудас руу буцах
  </a>

</div>


<script>

/* =====================================
   SUPABASE ТОХИРГОО
   ===================================== */

const SUPABASE_URL =
  "https://idjqvulwffvtqplwmamt.supabase.co/rest/v1/";

const SUPABASE_KEY =
  "sb_publishable_XsH8zpr25shhUUDjMEo0cQ_e5df7co5";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================
   FORM СОЛИХ
   ===================================== */

function showForm(type){

  const loginForm =
    document.getElementById("loginForm");

  const registerForm =
    document.getElementById("registerForm");

  const loginTab =
    document.getElementById("loginTab");

  const registerTab =
    document.getElementById("registerTab");


  if(type === "login"){

    loginForm.classList.add("active");
    registerForm.classList.remove("active");

    loginTab.classList.add("active");
    registerTab.classList.remove("active");

  }else{

    registerForm.classList.add("active");
    loginForm.classList.remove("active");

    registerTab.classList.add("active");
    loginTab.classList.remove("active");

  }

}


/* =====================================
   БҮРТГҮҮЛЭХ
   ===================================== */

async function register(){

  const name =
    document.getElementById(
      "registerName"
    ).value.trim();

  const email =
    document.getElementById(
      "registerEmail"
    ).value.trim();

  const password =
    document.getElementById(
      "registerPassword"
    ).value;

  const message =
    document.getElementById(
      "registerMessage"
    );


  message.style.display="block";


  if(!name || !email || !password){

    message.textContent =
      "⚠️ Бүх талбарыг бөглөнө үү.";

    return;

  }


  if(password.length < 6){

    message.textContent =
      "⚠️ Нууц үг хамгийн багадаа 6 тэмдэгт байна.";

    return;

  }


  const { data, error } =
    await supabaseClient.auth.signUp({

      email:email,

      password:password,

      options:{
        data:{
          full_name:name
        }
      }

    });


  if(error){

    message.textContent =
      "❌ " + error.message;

    return;

  }


  message.textContent =
    "✅ Бүртгэл амжилттай үүслээ. И-мэйлээ шалгана уу.";

}


/* =====================================
   НЭВТРЭХ
   ===================================== */

async function login(){

  const email =
    document.getElementById(
      "loginEmail"
    ).value.trim();

  const password =
    document.getElementById(
      "loginPassword"
    ).value;

  const message =
    document.getElementById(
      "loginMessage"
    );


  message.style.display="block";


  if(!email || !password){

    message.textContent =
      "⚠️ И-мэйл болон нууц үгээ оруулна уу.";

    return;

  }


  const { data, error } =
    await supabaseClient.auth.signInWithPassword({

      email:email,

      password:password

    });


  if(error){

    message.textContent =
      "❌ " + error.message;

    return;

  }


  message.textContent =
    "✅ Амжилттай нэвтэрлээ!";


  setTimeout(function(){

    window.location.href =
      "index.html";

  },1000);

}

</script>

</body>
</html>
