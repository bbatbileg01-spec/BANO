<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BANO Premium — Нэвтрэх</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 50% 20%,#2b0808 0%,#0b0b0b 45%,#050505 100%);
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.box{
  width:100%;
  max-width:420px;
  background:rgba(18,18,18,.96);
  border:1px solid #292929;
  border-radius:16px;
  padding:35px;
  box-shadow:0 25px 70px rgba(0,0,0,.55);
}

.logo{
  text-align:center;
  font-size:32px;
  font-weight:900;
  letter-spacing:3px;
  margin-bottom:8px;
}

.logo span{
  color:#e50914;
}

.subtitle{
  text-align:center;
  color:#888;
  font-size:14px;
  margin-bottom:30px;
}

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  background:#0c0c0c;
  border-radius:9px;
  padding:4px;
  margin-bottom:25px;
}

.tab{
  border:0;
  background:transparent;
  color:#777;
  padding:11px;
  border-radius:7px;
  cursor:pointer;
  font-weight:bold;
}

.tab.active{
  background:#e50914;
  color:#fff;
}

.form{
  display:none;
}

.form.active{
  display:block;
}

label{
  display:block;
  color:#bbb;
  font-size:13px;
  margin-bottom:7px;
}

input{
  width:100%;
  background:#0d0d0d;
  color:#fff;
  border:1px solid #303030;
  border-radius:8px;
  padding:13px;
  outline:none;
  margin-bottom:17px;
}

input:focus{
  border-color:#e50914;
}

.submit{
  width:100%;
  border:0;
  background:#e50914;
  color:#fff;
  padding:14px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
  margin-top:5px;
}

.submit:hover{
  background:#c90812;
}

.message{
  min-height:22px;
  margin-top:16px;
  text-align:center;
  font-size:13px;
  color:#aaa;
  line-height:1.5;
}

.back{
  display:block;
  text-align:center;
  margin-top:25px;
  color:#888;
  text-decoration:none;
  font-size:13px;
}

.back:hover{
  color:#fff;
}

.loading{
  opacity:.6;
  pointer-events:none;
}
</style>
</head>

<body>

<div class="box">

  <div class="logo">
    BANO<span>+</span>
  </div>

  <div class="subtitle">
    Киноны ертөнцөд тавтай морил
  </div>

  <div class="tabs">

    <button
      class="tab active"
      id="loginTab"
      onclick="showLogin()"
    >
      Нэвтрэх
    </button>

    <button
      class="tab"
      id="registerTab"
      onclick="showRegister()"
    >
      Бүртгүүлэх
    </button>

  </div>


  <!-- LOGIN -->

  <form
    class="form active"
    id="loginForm"
    onsubmit="login(event)"
  >

    <label>И-мэйл</label>

    <input
      id="loginEmail"
      type="email"
      placeholder="example@gmail.com"
      required
    >

    <label>Нууц үг</label>

    <input
      id="loginPassword"
      type="password"
      placeholder="Нууц үг"
      required
    >

    <button
      class="submit"
      id="loginButton"
      type="submit"
    >
      Нэвтрэх
    </button>

  </form>


  <!-- REGISTER -->

  <form
    class="form"
    id="registerForm"
    onsubmit="register(event)"
  >

    <label>И-мэйл</label>

    <input
      id="registerEmail"
      type="email"
      placeholder="example@gmail.com"
      required
    >

    <label>Нууц үг</label>

    <input
      id="registerPassword"
      type="password"
      placeholder="Доод тал нь 6 тэмдэгт"
      minlength="6"
      required
    >

    <label>Нууц үг давтах</label>

    <input
      id="registerPassword2"
      type="password"
      placeholder="Нууц үгээ дахин оруулна уу"
      minlength="6"
      required
    >

    <button
      class="submit"
      id="registerButton"
      type="submit"
    >
      Бүртгүүлэх
    </button>

  </form>


  <div
    class="message"
    id="message"
  ></div>


  <a
    class="back"
    href="index.html"
  >
    ← Нүүр хуудас руу буцах
  </a>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  "https://idjqvulwffvtqplwmamt.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_XsH8zpr25shhUUDjMEo0cQ_e5df7co5";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================
   ELEMENTS
========================================= */

const loginTab =
  document.getElementById("loginTab");

const registerTab =
  document.getElementById("registerTab");

const loginForm =
  document.getElementById("loginForm");

const registerForm =
  document.getElementById("registerForm");

const message =
  document.getElementById("message");


/* =========================================
   TABS
========================================= */

function showLogin(){

  loginTab.classList.add("active");

  registerTab.classList.remove("active");

  loginForm.classList.add("active");

  registerForm.classList.remove("active");

  message.textContent = "";

}


function showRegister(){

  registerTab.classList.add("active");

  loginTab.classList.remove("active");

  registerForm.classList.add("active");

  loginForm.classList.remove("active");

  message.textContent = "";

}


/* =========================================
   MESSAGE
========================================= */

function showMessage(text,type="normal"){

  message.textContent = text;

  if(type === "error"){
    message.style.color = "#ff6b6b";
  }
  else if(type === "success"){
    message.style.color = "#5ee38a";
  }
  else{
    message.style.color = "#aaa";
  }

}


/* =========================================
   LOGIN
========================================= */

async function login(event){

  event.preventDefault();

  const button =
    document.getElementById("loginButton");

  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("loginPassword")
      .value;


  button.disabled = true;

  button.textContent =
    "Нэвтэрч байна...";

  showMessage("Түр хүлээнэ үү...");


  const {
    data,
    error
  } = await supabaseClient.auth.signInWithPassword({
    email:email,
    password:password
  });


  if(error){

    console.error(error);

    showMessage(
      "❌ И-мэйл эсвэл нууц үг буруу байна.",
      "error"
    );

    button.disabled = false;

    button.textContent =
      "Нэвтрэх";

    return;

  }


  if(data.user){

    showMessage(
      "✅ Амжилттай нэвтэрлээ. Түр хүлээнэ үү...",
      "success"
    );

    setTimeout(function(){

      window.location.href =
        "index.html";

    },800);

  }

}


/* =========================================
   REGISTER
========================================= */

async function register(event){

  event.preventDefault();


  const button =
    document.getElementById("registerButton");

  const email =
    document
      .getElementById("registerEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("registerPassword")
      .value;

  const password2 =
    document
      .getElementById("registerPassword2")
      .value;


  if(password !== password2){

    showMessage(
      "❌ Нууц үгнүүд таарахгүй байна.",
      "error"
    );

    return;

  }


  if(password.length < 6){

    showMessage(
      "❌ Нууц үг хамгийн багадаа 6 тэмдэгт байна.",
      "error"
    );

    return;

  }


  button.disabled = true;

  button.textContent =
    "Бүртгүүлж байна...";

  showMessage(
    "Бүртгэл үүсгэж байна..."
  );


  const {
    data,
    error
  } = await supabaseClient.auth.signUp({

    email:email,

    password:password

  });


  if(error){

    console.error(error);

    showMessage(
      "❌ " + error.message,
      "error"
    );

    button.disabled = false;

    button.textContent =
      "Бүртгүүлэх";

    return;

  }


  if(data.user){

    /*
      Supabase дээр email confirmation
      асаалттай бол шууд нэвтрэхгүй,
      и-мэйлээ баталгаажуулах шаардлагатай.
    */

    if(data.session){

      showMessage(
        "✅ Бүртгэл амжилттай. Нэвтэрч байна...",
        "success"
      );

      setTimeout(function(){

        window.location.href =
          "index.html";

      },1000);

    }
    else{

      showMessage(
        "✅ Бүртгэл амжилттай! И-мэйлээ шалгаад баталгаажуулна уу.",
        "success"
      );

      button.disabled = false;

      button.textContent =
        "Бүртгүүлэх";

    }

  }

}


/* =========================================
   CHECK EXISTING SESSION
========================================= */

async function checkSession(){

  const {
    data:{
      session
    }
  } = await supabaseClient.auth.getSession();


  if(session){

    /*
      Аль хэдийн нэвтэрсэн бол
      нүүр хуудас руу буцаана.
    */

    window.location.href =
      "index.html";

  }

}


checkSession();

</script>

</body>
</html>
