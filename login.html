<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BANO — Нэвтрэх</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 50% 20%, #2b1800, #07080b 45%);
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
}

.login-box{
  width:420px;
  max-width:92%;
  background:#111318;
  border:1px solid #292c33;
  border-radius:18px;
  padding:40px;
  box-shadow:0 25px 80px rgba(0,0,0,.6);
}

.logo{
  text-align:center;
  font-size:38px;
  font-weight:900;
  letter-spacing:6px;
  margin-bottom:10px;
}

.logo span{
  color:#ff9d00;
}

.subtitle{
  text-align:center;
  color:#888;
  margin-bottom:32px;
}

.tabs{
  display:flex;
  background:#08090c;
  border-radius:10px;
  padding:4px;
  margin-bottom:25px;
}

.tab{
  width:50%;
  padding:11px;
  border:0;
  border-radius:8px;
  background:transparent;
  color:#777;
  cursor:pointer;
  font-weight:bold;
}

.tab.active{
  background:#ff9d00;
  color:#08090c;
}

.form{
  display:none;
}

.form.active{
  display:block;
}

label{
  display:block;
  color:#aaa;
  font-size:13px;
  margin-bottom:8px;
}

.input{
  width:100%;
  padding:14px;
  margin-bottom:18px;
  background:#08090c;
  border:1px solid #292c33;
  border-radius:9px;
  color:#fff;
  outline:none;
  font-size:15px;
}

.input:focus{
  border-color:#ff9d00;
}

.button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:9px;
  background:#ff9d00;
  color:#08090c;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.button:hover{
  background:#ffb52e;
}

.message{
  display:none;
  text-align:center;
  color:#ffb52e;
  margin-top:15px;
  font-size:14px;
}

.back{
  display:block;
  text-align:center;
  margin-top:25px;
  color:#777;
  text-decoration:none;
  font-size:14px;
}

.back:hover{
  color:#fff;
}

@media(max-width:500px){

  .login-box{
    padding:28px 22px;
  }

  .logo{
    font-size:32px;
  }

}

</style>
</head>

<body>

<div class="login-box">

  <div class="logo">
    BAN<span>O</span>
  </div>

  <div class="subtitle">
    Киноны ертөнцөд тавтай морил
  </div>


  <div class="tabs">

    <button
      class="tab active"
      onclick="showForm('login')"
      id="loginTab"
    >
      Нэвтрэх
    </button>

    <button
      class="tab"
      onclick="showForm('register')"
      id="registerTab"
    >
      Бүртгүүлэх
    </button>

  </div>


  <!-- LOGIN -->

  <div
    class="form active"
    id="loginForm"
  >

    <label>
      И-мэйл
    </label>

    <input
      class="input"
      type="email"
      placeholder="example@gmail.com"
      id="loginEmail"
    >


    <label>
      Нууц үг
    </label>

    <input
      class="input"
      type="password"
      placeholder="Нууц үгээ оруулна уу"
      id="loginPassword"
    >


    <button
      class="button"
      onclick="login()"
    >
      Нэвтрэх
    </button>


    <div
      class="message"
      id="loginMessage"
    >
      Нэвтрэх хэсэг бэлэн боллоо.
    </div>

  </div>


  <!-- REGISTER -->

  <div
    class="form"
    id="registerForm"
  >

    <label>
      Нэр
    </label>

    <input
      class="input"
      type="text"
      placeholder="Таны нэр"
      id="registerName"
    >


    <label>
      И-мэйл
    </label>

    <input
      class="input"
      type="email"
      placeholder="example@gmail.com"
      id="registerEmail"
    >


    <label>
      Нууц үг
    </label>

    <input
      class="input"
      type="password"
      placeholder="Нууц үг үүсгэнэ үү"
      id="registerPassword"
    >


    <button
      class="button"
      onclick="register()"
    >
      Бүртгэл үүсгэх
    </button>


    <div
      class="message"
      id="registerMessage"
    >
      Бүртгэлийн хэсэг бэлэн боллоо.
    </div>

  </div>


  <a
    class="back"
    href="index.html"
  >
    ← BANO нүүр хуудас руу буцах
  </a>

</div>


<script>

function showForm(type){

  const loginForm =
    document.getElementById("loginForm");

  const registerForm =
    document.getElementById("registerForm");

  const loginTab =
    document.getElementById("loginTab");

  const registerTab =
    document.getElementById("registerTab");


  if(type === "login"){

    loginForm.classList.add("active");
    registerForm.classList.remove("active");

    loginTab.classList.add("active");
    registerTab.classList.remove("active");

  }else{

    registerForm.classList.add("active");
    loginForm.classList.remove("active");

    registerTab.classList.add("active");
    loginTab.classList.remove("active");

  }

}


function register(){

  const name =
    document.getElementById("registerName").value;

  const email =
    document.getElementById("registerEmail").value;

  const password =
    document.getElementById("registerPassword").value;

  const message =
    document.getElementById("registerMessage");


  if(
    name === "" ||
    email === "" ||
    password === ""
  ){

    message.style.display="block";
    message.textContent =
      "⚠️ Бүх талбарыг бөглөнө үү.";

    return;

  }


  message.style.display="block";

  message.textContent =
    "✅ Бүртгэл амжилттай үүсгэгдлээ.";

}


function login(){

  const email =
    document.getElementById("loginEmail").value;

  const password =
    document.getElementById("loginPassword").value;

  const message =
    document.getElementById("loginMessage");


  if(
    email === "" ||
    password === ""
  ){

    message.style.display="block";

    message.textContent =
      "⚠️ И-мэйл болон нууц үгээ оруулна уу.";

    return;

  }


  message.style.display="block";

  message.textContent =
    "✅ Нэвтрэх систем бэлэн боллоо.";

}

</script>

</body>
</html>
